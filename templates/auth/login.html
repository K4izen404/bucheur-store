{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card reveal">
    <img src="{{ url_for('static', filename='uploads/logo.jpg') }}" alt="Bûcheur Études & Business" style="width:64px; height:64px; border-radius:14px; margin:0 auto 16px; display:block;">
    <h1>Bon retour 👋</h1>
    <p class="sub">Connectez-vous avec votre adresse email.</p>
    <form method="post" data-validate data-loading>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="login-email">Adresse email</label>
        <input type="email" id="login-email" name="email" required placeholder="vous@email.com" autocomplete="email" data-rule="email" value="{{ email or '' }}">
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <div style="text-align:right; margin-bottom:14px;">
        <a href="{{ url_for('forgot_password') }}" class="small" style="color:var(--gold);">Mot de passe oublié ?</a>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Se connecter</button>
    </form>
    <div class="auth-alt">Pas encore de compte ? <a href="{{ url_for('register') }}">Créer un compte</a></div>
  </div>
</div>

{% endblock %}
