{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card reveal">
    <img src="{{ url_for('static', filename='uploads/logo.jpg') }}" alt="Bûcheur Store" style="width:64px; height:64px; border-radius:14px; margin:0 auto 16px; display:block;">
    <h1>Créer un compte 🚀</h1>
    <p class="sub">Suivez vos commandes et achetez plus vite.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Nom complet</label>
        <input type="text" name="name" required placeholder="Votre nom">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="vous@email.com">
      </div>
      <div class="field">
        <label>Téléphone</label>
        <input type="tel" name="phone" placeholder="77 000 00 00">
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" name="password" required placeholder="Minimum 6 caractères">
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" name="confirm" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-gold btn-block">Créer mon compte</button>
    </form>
    <div class="auth-alt">Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></div>
  </div>
</div>

{% endblock %}
