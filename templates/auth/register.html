{% extends "base.html" %}
{% block title %}Inscription{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card reveal">
    <img src="{{ url_for('static', filename='uploads/logo.jpg') }}" alt="Bûcheur Études & Business" style="width:64px; height:64px; border-radius:14px; margin:0 auto 16px; display:block;">
    <h1>Créer un compte 🚀</h1>
    <p class="sub">Un code de vérification (OTP) vous sera envoyé par email pour finaliser votre compte.</p>
    <form method="post" data-validate data-loading>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="reg-name">Nom complet</label>
        <input type="text" id="reg-name" name="name" required placeholder="Votre nom" data-rule="required">
      </div>
      <div class="field">
        <label for="reg-email">Adresse email *</label>
        <input type="email" id="reg-email" name="email" required placeholder="vous@email.com" autocomplete="email" data-rule="email">
      </div>
      <div class="field">
        <label for="reg-phone">Téléphone * <span class="tag-line">(coordonnée de contact, ex : 77 123 45 67)</span></label>
        <input type="tel" id="reg-phone" name="phone" required placeholder="77 123 45 67" autocomplete="tel" data-rule="phone">
      </div>
      <div class="field">
        <label for="reg-password">Mot de passe</label>
        <input type="password" id="reg-password" name="password" required placeholder="Minimum 6 caractères" data-rule="required">
      </div>
      <div class="field">
        <label for="reg-confirm">Confirmer le mot de passe</label>
        <input type="password" id="reg-confirm" name="confirm" required placeholder="••••••••" data-match="#reg-password">
      </div>
      <button type="submit" class="btn btn-gold btn-block">Envoyer le code de vérification →</button>
    </form>
    <div class="auth-alt">Déjà inscrit ? <a href="{{ url_for('login') }}">Se connecter</a></div>
  </div>
</div>

{% endblock %}
