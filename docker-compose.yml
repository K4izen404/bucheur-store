services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # --- À compléter AVANT la mise en ligne ---
      SECRET_KEY: CHANGEZMOI-une-longue-cle-aleatoire-64-caracteres
      FORCE_HTTPS: "1"          # passer à "0" si pas encore de HTTPS
      APP_BASE_URL: https://monsite.example
      # --- Emails Gmail ---
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: bucheur.store@gmail.com
      SMTP_PASSWORD: VOTRE-MOT-DE-PASSE-APPLICATION-GMAIL
      SMTP_FROM: bucheur.store@gmail.com
      ADMIN_NOTIFY_EMAIL: bucheur.store@gmail.com
    volumes:
      # La base de données et les images produits : PERSISTANTES
      - bucheur_data:/app/data
      - bucheur_uploads:/app/static/uploads
    restart: unless-stopped

volumes:
  bucheur_data:
  bucheur_uploads: